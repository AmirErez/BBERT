name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            envfile: BBERT_env.yml
          - os: macos-latest
            envfile: BBERT_env_mac.yml
          - os: windows-latest
            envfile: BBERT_env_windows_cpu.yml

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        # Note: LFS disabled - models are now downloaded from Hugging Face Hub

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ${{ matrix.envfile }}
          cache-environment: true
          cache-downloads: true

      - name: Install package
        shell: bash -l {0}
        run: pip install -e .

      - name: System diagnostics
        shell: bash -l {0}
        run: |
          echo "BBERT version:"
          bbert --version
          echo "Python version:"
          python --version
          echo "Package location:"
          python -c "import bbert; print(bbert.__file__)"

      - name: Install coverage tools
        shell: bash -l {0}
        run: pip install coverage

      - name: Run tests with coverage
        shell: bash -l {0}
        run: |
          # Run unit tests from tests/ directory (if exists)
          if [ -d "tests" ] && [ -n "$(find tests -name 'test_*.py' 2>/dev/null)" ]; then
            coverage run --source=bbert -m unittest discover -s tests -p "test_*.py"
          else
            echo "No unit tests found in tests/ directory"
            # Initialize coverage with no tests
            coverage run --source=bbert -m unittest discover -s . -p "test_nonexistent.py" 2>/dev/null || true
          fi
          # Generate reports
          coverage report
          coverage html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ matrix.os }}
          path: htmlcov/

      - name: Check coverage threshold
        shell: bash -l {0}
        run: |
          coverage report --fail-under=0 || echo "::warning::Coverage is below threshold"

      - name: End-to-end example (small)
        shell: bash -l {0}
        run: |
          bbert infer examples/data/example.fasta \
            --output-dir example_ci \
            --batch-size 8 \
            --max-reads 200
