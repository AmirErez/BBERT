name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            envfile: BBERT_env.yml
          - os: macos-latest
            envfile: BBERT_env_mac.yml
          - os: windows-latest
            envfile: BBERT_env_windows_cpu.yml

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        # Note: LFS disabled - models are now downloaded from Hugging Face Hub

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ${{ matrix.envfile }}
          cache-environment: true
          cache-downloads: true

      - name: System diagnostics
        shell: bash -l {0}
        run: python bbert.py --check

      - name: Install coverage tools
        shell: bash -l {0}
        run: pip install coverage

      - name: Run tests with coverage
        shell: bash -l {0}
        run: |
          # Run unit tests from tests/ directory
          coverage run --source=source -m unittest discover -s tests -p "test_*.py"
          # Run integration tests from source/ directory (append coverage)
          coverage run -a --source=source -m unittest discover -s source -p "test_*.py"
          # Generate reports
          coverage report
          coverage html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ matrix.os }}
          path: htmlcov/

      - name: Check coverage threshold
        shell: bash -l {0}
        run: |
          coverage report --fail-under=2 || echo "::warning::Coverage is below 2%"

      - name: End-to-end example (small)
        shell: bash -l {0}
        run: |
          python bbert.py examples/data/example.fasta \
            --output_dir example_ci \
            --batch_size 8 \
            --max_reads 200
