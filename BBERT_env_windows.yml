name: BBERT_windows
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - transformers=4.30.2
  - biopython
  - pandas
  - numpy<2
  - pyarrow
  - scikit-learn
  - seaborn
  - tqdm
  - pyyaml
  - datasets
  - huggingface_hub
  - safetensors
  - tokenizers=0.13.3
  - pillow
  - matplotlib
  - git  # For Git LFS
  - pip
  - pip:
      # NOTE: PyTorch MUST be installed separately after environment creation
      # See README section "For Windows" for post-installation steps
      # This ensures CUDA support is properly configured on Windows
      - psutil
      - torchinfo
      - accelerate
      - protobuf
      # pynvml may fail on Windows - BBERT handles this gracefully