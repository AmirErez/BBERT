[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bbert"
version = "0.2.0"
description = "BERT for Bacterial DNA Classification - A transformer model for DNA sequence analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Amir Erez", email = "amir.erez@mail.huji.ac.il"},
    {name = "Denis Alekhin"},
    {name = "Moran Alon"},
    {name = "Tali Sidi"},
    {name = "Shany Perez"},
    {name = "Guy Carmi"},
    {name = "Omri Finkel"},
]
keywords = [
    "bioinformatics",
    "DNA",
    "classification",
    "BERT",
    "transformers",
    "metagenomics",
    "bacterial-classification",
    "reading-frame",
    "coding-sequence",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0,<4.47.0",
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "biopython>=1.80",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "huggingface-hub>=0.16.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "colorama>=0.4.6",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.4.0",
    "build>=0.10.0",
    "twine>=4.0.0",
]
viz = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "umap-learn>=0.5.3",
]
all = [
    "bbert[dev,viz]",
]

[project.urls]
Homepage = "https://github.com/AmirErez/BBERT"
Documentation = "https://github.com/AmirErez/BBERT#readme"
Repository = "https://github.com/AmirErez/BBERT"
"Bug Tracker" = "https://github.com/AmirErez/BBERT/issues"
"Research Paper" = "https://doi.org/10.1101/2025.09.07.674730"

[project.scripts]
bbert = "bbert.cli.main:main"

[tool.setuptools]
package-dir = {"" = "."}
packages = ["bbert", "bbert.core", "bbert.models", "bbert.cli", "bbert.cli.commands", "bbert.utils"]

[tool.setuptools.package-data]
bbert = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | Graveyard
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
extend_skip = ["Graveyard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--cov=bbert",
    "--cov-report=html",
    "--cov-report=term-missing",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "gpu: marks tests that require GPU",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
files = ["bbert"]

[tool.coverage.run]
source = ["bbert"]
omit = [
    "*/tests/*",
    "*/Graveyard/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
